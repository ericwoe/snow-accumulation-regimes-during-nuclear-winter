[project]
name = "snow-accumulation-regimes-during-nuclear-winter"
version = "0.1.0"
description = "Snow storage and snowmelt dynamics in major river basins under nuclear winter conditions"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2025.12.0",
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "nc-time-axis>=1.4.1",
    "netcdf4==1.6.5",
    "numba==0.58.1",
    "numpy>=1.26.4",
    "pyproj==3.7",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "tslearn>=0.7.0",
    "xarray==2024.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.9.0",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # E/F: pyflakes/pycodestyle (flake8), I: isort
ignore = ["E203"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
